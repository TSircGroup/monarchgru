# MonarchGRU environment: Linux x86-64 with an NVIDIA GPU whose driver supports CUDA 12.8 or newer.
# Lists only the packages the code uses; conda adds what they need (CUDA, cuDNN, MKL, FFmpeg, ...).
name: monarch-gru-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.14
  - cuda-version=12.9       # CUDA 12.9 builds of the GPU packages
  - pytorch-gpu=2.13.0      # PyTorch with GPU support
  - torchaudio=2.11.0       # log-Mel features and audio loading
  - torchcodec=0.16.0       # used by torchaudio to read the WAV files
  - numpy=2.5.3
  - requests=2.34.2         # imported by utils.py; downloads the dataset (--download)
